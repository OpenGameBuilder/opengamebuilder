name: ogb-production

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    networks:
      ogb-edge:
        aliases:
          - api-production

networks:
  ogb-edge:
    external: true
