name: Feature Request
description: Propose a new capability.
type: Feature

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new capability.

        Use this form for specific new capabilities. For improvements to existing behavior, use the Enhancement form. For broad or exploratory ideas, start a [GitHub Discussion](https://github.com/OpenGameBuilder/opengamebuilder/discussions).

        Please do not include private information, security vulnerability details, sensitive material, archived game dumps, original proprietary assets, or decompiled source code.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing requests to avoid creating a duplicate.
          required: true
        - label: This request does not include private, sensitive, security-related, proprietary, or decompiled-source material.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: Briefly describe the new capability.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why would this be useful?
      description: What problem does this solve, or what would it make better?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Best guess is fine.
      multiple: true
      options:
        - Web client
        - API/backend
        - Development experience
        - CI/CD
        - Not sure
        - Other
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples, sketches, or related ideas
      description: Add examples, mockups, screenshots, links, or rough notes if useful.
    validations:
      required: false
