name: Feature Request
description: Suggest an improvement or new feature.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Use this form for specific feature requests. If the idea is broad or exploratory, the Discord server may be a better fit.

        Please do not include private information, security vulnerability details, sensitive material, archived game dumps, original proprietary assets, or decompiled source code.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing requests to avoid creating a duplicate.
          required: true
        - label: This request does not include private, sensitive, security-related, proprietary, or decompiled-source material.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: Briefly describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why would this be useful?
      description: What problem does this solve, or what would it make better?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Best guess is fine.
      multiple: true
      options:
        - Web client
        - API/backend
        - Development experience
        - CI/CD
        - Not sure
        - Other
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples, sketches, or related ideas
      description: Add examples, mockups, screenshots, links, or rough notes if useful.
    validations:
      required: false
