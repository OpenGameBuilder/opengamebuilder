name: 🧱 CI

on:
  pull_request:
  push:
    branches:
      - "patch/v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # This check name is the branch-protection contract; keep it stable.
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate solution
        uses: ./.github/actions/validate
        with:
          artifact-name: ci-validation

      - name: Build API image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: src/OpenGameBuilder.Api/Dockerfile
          push: false
