name: 🧱 CI

on:
  pull_request:
  push:
    branches:
      - "patch/v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # This check name is the branch-protection contract; keep it stable.
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate solution
        uses: ./.github/actions/validate
        with:
          artifact-name: ci-validation

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/OpenGameBuilder.Api/Dockerfile
          push: false
          load: true
          tags: opengamebuilder-api:ci

      - name: Verify API image runtime
        run: bash scripts/verify-api-image.sh opengamebuilder-api:ci
