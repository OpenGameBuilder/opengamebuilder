name: 🚀 CD Production

# Dispatch this workflow from main so the latest workflow file is used.
# For a standard release, leave `ref` as main. For a patch release, set `ref`
# to `patch/vX.Y.Z`. The workflow checks out `ref`, so release scripts and
# validation run from that ref. It detects release kind from the version in
# Directory.Build.props on the checked-out ref.
#
# On success it:
#   1. Validates the version vs. the latest GitHub Release
#   2. Builds, tests, deploys, and smoke-tests against production
#   3. Creates the immutable tag and GitHub Release
#   4. Opens a follow-up PR (version bump for standard, merge-back for patch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to release and use for release scripts. Use `main` for standard releases or `patch/vX.Y.Z` for patch releases. Defaults to `main`."
        required: false
        type: string
        default: main

# Validation can execute a selected protected patch branch in main's run context.
cache-mode: none

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  require-main-dispatch:
    name: Require main dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject non-main workflow ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != 'refs/heads/main' ]; then
            echo "CD Production must be dispatched from main, not $DISPATCH_REF." >&2
            exit 1
          fi

  resolve-source:
    needs: require-main-dispatch
    uses: ./.github/workflows/_resolve-source.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}

  validate:
    name: Validate release
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      kind: ${{ steps.validate.outputs.kind }}
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      previous_tag: ${{ steps.validate.outputs.previous_tag }}
      next_main_version: ${{ steps.validate.outputs.next_main_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.protected-revision }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref }}
        run: bash ./scripts/validate-release.sh

  deploy:
    name: Deploy production
    needs: validate
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment-slug: production
      source-ref: ${{ inputs.ref }}
      git-ref: ${{ needs.validate.outputs.source_sha }}
      # Repo variable PRODUCTION_SMOKE_TEST_URL holds the public base URL for
      # the browser's frontend-to-API smoke test.
      smoke-test-url-var: PRODUCTION_SMOKE_TEST_URL
    # Required for the called job to receive its selected environment's secrets.
    secrets: inherit

  publish:
    name: Tag and release
    needs:
      - validate
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: bash ./scripts/publish-release.sh

      - name: Open follow-up PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: ${{ needs.validate.outputs.kind }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          NEXT_MAIN_VERSION: ${{ needs.validate.outputs.next_main_version }}
        run: bash ./scripts/post-release.sh
