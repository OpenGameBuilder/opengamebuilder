name: 🛰️ CD Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment-slug: staging
      dotnet-environment: Staging
      smoke-test-url-var: STAGING_SMOKE_TEST_URL
    secrets: inherit
