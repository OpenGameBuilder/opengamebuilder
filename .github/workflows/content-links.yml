name: External documentation links

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-documentation-links
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned tools
        shell: pwsh
        run: ./scripts/install-content-tools.ps1
      - name: Report external links
        id: links
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check.ps1 external-links
      - name: Summarize maintenance result
        if: ${{ always() }}
        env:
          LINK_OUTCOME: ${{ steps.links.outcome }}
        run: |
          printf 'External link report: %s. Owner: ostomachion. Review the report artifact; remote outages do not block PRs.\n' "$LINK_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-links-${{ github.run_attempt }}
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 7
