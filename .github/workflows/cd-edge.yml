name: 🌐 CD Shared Edge

# Run from main when the shared Caddyfile or edge Compose definition changes.
# This is the only workflow that writes shared edge files or updates Caddy.
on:
  workflow_dispatch:

concurrency:
  group: cd-shared-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  require-main-dispatch:
    name: Require main dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject non-main workflow ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != 'refs/heads/main' ]; then
            echo "Shared edge updates must be dispatched from main, not $DISPATCH_REF." >&2
            exit 1
          fi

  apply:
    name: Validate and apply shared edge
    needs: require-main-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is unavailable to the edge job."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo '::error::DEPLOY_HOST is invalid.'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo '::error::DEPLOY_USER is invalid.'; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo '::error::DEPLOY_KNOWN_HOSTS has no key for DEPLOY_HOST.'
            exit 1
          }
          printf 'Host deployment\n  HostName %s\n  User %s\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts

      - name: Transfer candidate and apply it
        env:
          CANDIDATE_DIR: /srv/opengamebuilder/edge-candidates/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh deployment \
            mkdir -p "$CANDIDATE_DIR"
          rsync -az \
            ./deploy/edge/compose.yml ./deploy/edge/Caddyfile \
            deployment:"$CANDIDATE_DIR/"
          ssh deployment \
            bash -s -- "$CANDIDATE_DIR" < ./scripts/apply-edge.sh

      - name: Check both sites after edge update
        env:
          STAGING_URL: ${{ vars.STAGING_SMOKE_TEST_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          for name in STAGING_URL PRODUCTION_URL; do
            url="${!name}"
            if [ -z "$url" ]; then
              echo "::error::${name} is not configured."
              exit 1
            fi
            curl --fail --show-error --silent --location \
              --connect-timeout 10 --max-time 30 --retry-max-time 180 \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${url%/}/api/alive" >/dev/null
          done
