name: 🌐 CD Edge

# One edge per host. Its profile explicitly selects the environments it serves.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment providing this host's credentials (shared edge requires production)"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production
      allow-profile-change:
        description: "Production-approved migration: allow changing an already marked host's edge profile"
        required: false
        type: boolean
        default: false

# Serialize edge maintenance, including two environments pointing at one host.
concurrency:
  group: cd-shared-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  require-main-dispatch:
    name: Require main dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject non-main workflow ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != 'refs/heads/main' ]; then
            echo "Edge updates must be dispatched from main, not $DISPATCH_REF." >&2
            exit 1
          fi

  authorize-profile-change:
    name: Authorize host profile migration
    needs: require-main-dispatch
    if: ${{ inputs.allow-profile-change }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Record production authorization
        run: echo 'Production environment authorization obtained for this host profile migration.'

  apply:
    name: Validate and apply host edge
    needs:
      - require-main-dispatch
      - authorize-profile-change
    # Normal isolated staging does not enter or depend on the production environment.
    # A migration must have completed its separate production approval gate.
    if: ${{ !cancelled() && needs.require-main-dispatch.result == 'success' && (needs.authorize-profile-change.result == 'success' || (!inputs.allow-profile-change && needs.authorize-profile-change.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment configuration and edge ownership
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          EDGE_PROFILE: ${{ vars.EDGE_PROFILE }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STAGING_URL: ${{ vars.STAGING_SMOKE_TEST_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          bash scripts/resolve-edge-profile.sh "$DEPLOY_ENVIRONMENT" "$EDGE_PROFILE" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_ENVIRONMENT" != production && "$EDGE_PROFILE" == shared ]]; then
            echo '::error::Shared edge updates require the production environment.'
            exit 1
          fi
          for name in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is unavailable to the edge job."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo '::error::DEPLOY_HOST is invalid.'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo '::error::DEPLOY_USER is invalid.'; exit 1; }
          if [[ "$EDGE_PROFILE" == shared || "$EDGE_PROFILE" == staging ]]; then
            [[ "$STAGING_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || { echo '::error::STAGING_SMOKE_TEST_URL must be an HTTPS origin.'; exit 1; }
          fi
          if [[ "$EDGE_PROFILE" == shared || "$EDGE_PROFILE" == production ]]; then
            [[ "$PRODUCTION_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || { echo '::error::PRODUCTION_SMOKE_TEST_URL must be an HTTPS origin.'; exit 1; }
          fi

      - name: Render only this host's environments
        env:
          EDGE_PROFILE: ${{ steps.target.outputs.profile }}
        run: bash scripts/render-edge.sh "$EDGE_PROFILE" artifacts/edge-candidate

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo '::error::DEPLOY_KNOWN_HOSTS has no key for DEPLOY_HOST.'
            exit 1
          }
          printf 'Host deployment\n  HostName %s\n  User %s\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts

      - name: Transfer candidate and apply it
        env:
          CANDIDATE_DIR: /srv/opengamebuilder/edge-candidates/${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_PROFILE_CHANGE: ${{ inputs.allow-profile-change }}
        run: |
          set -euo pipefail
          ssh deployment mkdir -p "$CANDIDATE_DIR"
          rsync -az artifacts/edge-candidate/compose.yml artifacts/edge-candidate/Caddyfile \
            deployment:"$CANDIDATE_DIR/"
          ssh deployment \
            bash -s -- "$CANDIDATE_DIR" "$DEPLOY_ENVIRONMENT" "$ALLOW_PROFILE_CHANGE" < scripts/apply-edge.sh

      - name: Check selected edge routes on the deployed host
        env:
          EDGE_ENVIRONMENTS: ${{ steps.target.outputs.environments }}
          STAGING_URL: ${{ vars.STAGING_SMOKE_TEST_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          for environment in $EDGE_ENVIRONMENTS; do
            case "$environment" in
              staging) url="$STAGING_URL" ;;
              production) url="$PRODUCTION_URL" ;;
              *) echo 'Unexpected edge environment.' >&2; exit 1 ;;
            esac
            # Probe the host reached through pinned SSH, not a possibly old DNS target.
            # /health is edge readiness; initial setup does not need an API deployed yet.
            ssh deployment bash -s -- "$environment" "$url" < scripts/check-edge-health.sh
          done
