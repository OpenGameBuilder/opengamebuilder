name: Publish documentation

cache-mode: none

# Publication is an explicit maintainer action, never a side effect of a PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate protected documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require protected main
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main || "$SOURCE_PROTECTED" != true ]]; then
            echo 'Documentation publication requires a dispatch from protected main.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source content
        uses: ./.github/actions/validate
        with:
          mode: content
          artifact-name: pages-content-validation
      - name: Build and check the documentation site
        uses: ./.github/actions/docs
      - name: Package the validated site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: artifacts/docs/site

  deploy:
    name: Publish validated documentation
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
