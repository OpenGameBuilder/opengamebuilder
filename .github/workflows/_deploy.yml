name: _ Deploy

on:
  workflow_call:
    inputs:
      environment-slug:
        description: "Environment slug, e.g. staging or production"
        required: true
        type: string
      dotnet-environment:
        description: "Value for ASPNETCORE_ENVIRONMENT, e.g. Staging or Production"
        required: true
        type: string
      git-ref:
        description: "Git ref to deploy. Defaults to the calling workflow's ref."
        required: false
        type: string
        default: ""
      smoke-test-url-var:
        description: "Name of the repository variable holding the base URL to smoke test (e.g. https://staging.opengamebuilder.com). The API liveness path is appended automatically."
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  DEPLOY_ROOT: /srv/opengamebuilder
  EDGE_DIR: /srv/opengamebuilder/edge
  APP_DIR: /srv/opengamebuilder/${{ inputs.environment-slug }}
  WEB_DIR: /srv/opengamebuilder/${{ inputs.environment-slug }}/web
  COMPOSE_FILE: ./deploy/${{ inputs.environment-slug }}/compose.yml
  API_IMAGE_NAME: ghcr.io/opengamebuilder/opengamebuilder-api

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.git-ref }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore opengamebuilder.slnx

      - name: Build
        run: dotnet build opengamebuilder.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test opengamebuilder.slnx --configuration Release --no-build

  deploy:
    name: Deploy ${{ inputs.environment-slug }}
    needs: build-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-slug }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.git-ref }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish web client
        run: >
          dotnet publish
          src/OpenGameBuilder.Web.Client/OpenGameBuilder.Web.Client.csproj
          --configuration Release
          --output ./artifacts/web
          -p:WasmApplicationEnvironmentName=${{ inputs.dotnet-environment }}

      - name: Locate web publish output
        run: |
          if [ -f ./artifacts/web/wwwroot/index.html ]; then
            echo "WEB_SOURCE=./artifacts/web/wwwroot" >> "$GITHUB_ENV"
          elif [ -f ./artifacts/web/index.html ]; then
            echo "WEB_SOURCE=./artifacts/web" >> "$GITHUB_ENV"
          else
            echo "Could not find published index.html" >&2
            find ./artifacts/web -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Resolve image tag
        id: image
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "api-image=${API_IMAGE_NAME}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push API image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: src/OpenGameBuilder.Api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.api-image }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync deployment files
        env:
          API_IMAGE: ${{ steps.image.outputs.api-image }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<EOF
            set -euo pipefail
            mkdir -p "${EDGE_DIR}" "${APP_DIR}" "${WEB_DIR}"
            printf '%s\n' "API_IMAGE=${API_IMAGE}" > "${APP_DIR}/.env"
            docker network inspect ogb-edge >/dev/null 2>&1 || docker network create ogb-edge
          EOF

          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            "$WEB_SOURCE/" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"${WEB_DIR}/"

          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            "${COMPOSE_FILE}" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"${APP_DIR}/compose.yml"

          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            ./deploy/edge/compose.yml \
            ./deploy/edge/Caddyfile \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"${EDGE_DIR}/"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<EOF
            set -euo pipefail
            cd "${APP_DIR}"
            docker compose pull
            docker compose up -d

            cd "${EDGE_DIR}"
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || docker compose restart caddy

            docker image prune -f
          EOF

  smoke-test:
    name: Smoke test ${{ inputs.environment-slug }}
    needs: deploy
    if: ${{ inputs.smoke-test-url-var != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Curl API liveness endpoint
        env:
          SMOKE_TEST_BASE_URL: ${{ vars[inputs.smoke-test-url-var] }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_TEST_BASE_URL}" ]; then
            echo "Repository variable '${{ inputs.smoke-test-url-var }}' is not set." >&2
            exit 1
          fi
          # Probe the API-backed liveness endpoint (proxied by the edge via /api/*) so the
          # smoke test verifies the API process is actually up, not just the static edge response.
          SMOKE_TEST_URL="${SMOKE_TEST_BASE_URL%/}/api/alive"
          echo "Smoke testing ${SMOKE_TEST_URL}"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${SMOKE_TEST_URL}" >/dev/null
