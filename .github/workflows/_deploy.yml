name: _ Deploy

on:
  workflow_call:
    inputs:
      environment-slug:
        description: "Environment slug, e.g. staging or production"
        required: true
        type: string
      git-ref:
        description: "Expected protected-branch commit. Defaults to the calling workflow's commit."
        required: false
        type: string
        default: ""
      source-ref:
        description: "Protected source branch. Defaults to the calling workflow's branch."
        required: false
        type: string
        default: ""
      smoke-test-url-var:
        description: "Name of the repository variable holding the base URL to smoke test (e.g. https://staging.opengamebuilder.com). The API liveness path is appended automatically."
        required: false
        type: string
        default: ""

# A selected protected source is executed in jobs launched from the default branch.
# Disable shared Actions cache access so it cannot poison that cache scope.
cache-mode: none

env:
  HUSKY: "0"
  REGISTRY: ghcr.io
  DEPLOY_ROOT: /srv/opengamebuilder
  APP_DIR: /srv/opengamebuilder/${{ inputs.environment-slug }}
  WEB_DIR: /srv/opengamebuilder/${{ inputs.environment-slug }}/web
  COMPOSE_FILE: ./deploy/${{ inputs.environment-slug }}/compose.yml

jobs:
  resolve-source:
    uses: ./.github/workflows/_resolve-source.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.source-ref || github.ref_name }}
      expected-sha: ${{ inputs.git-ref || github.sha }}

  build-test:
    name: Build and test
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the trusted validation definition
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate solution
        uses: ./.github/actions/validate
        with:
          checkout-ref: ${{ needs.resolve-source.outputs.sha }}
          working-directory: deployment-source
          artifact-name: ${{ inputs.environment-slug }}-validation

  package:
    name: Package portable web client
    needs:
      - resolve-source
      - build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      web-sha256: ${{ steps.web-identity.outputs.web-sha256 }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: Publish web client
        run: >
          dotnet publish
          src/OpenGameBuilder.Web.Client/OpenGameBuilder.Web.Client.csproj
          --configuration Release
          --output ./artifacts/web

      - name: Locate web publish output
        run: |
          if [ -f ./artifacts/web/wwwroot/index.html ]; then
            echo "WEB_SOURCE=./artifacts/web/wwwroot" >> "$GITHUB_ENV"
          elif [ -f ./artifacts/web/index.html ]; then
            echo "WEB_SOURCE=./artifacts/web" >> "$GITHUB_ENV"
          else
            echo "Could not find published index.html" >&2
            find ./artifacts/web -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Verify portable web configuration
        run: bash scripts/verify-web-publish.sh "$WEB_SOURCE"

      - name: Bundle published web files
        run: tar -czf ./artifacts/web-release.tar.gz -C "$WEB_SOURCE" .

      - name: Record web archive checksum
        id: web-identity
        run: |
          set -euo pipefail
          web_sha="$(sha256sum ./artifacts/web-release.tar.gz | cut -d ' ' -f 1)"
          echo "web-sha256=$web_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.environment-slug }}
          path: artifacts/web-release.tar.gz
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy ${{ inputs.environment-slug }}
    needs:
      - resolve-source
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment-slug }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check deployment credentials
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is unavailable to the deployment job."
              exit 1
            fi
          done

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.environment-slug }}
          path: artifacts/release

      - name: Verify and unpack the packaged frontend
        env:
          WEB_SHA256: ${{ needs.package.outputs.web-sha256 }}
        run: |
          set -euo pipefail
          echo "${WEB_SHA256}  artifacts/release/web-release.tar.gz" | sha256sum --check
          mkdir -p artifacts/web-deploy
          tar -xzf artifacts/release/web-release.tar.gz -C artifacts/web-deploy
          bash scripts/verify-web-publish.sh artifacts/web-deploy

      - name: Resolve image tag
        id: image
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opengamebuilder-api"
          echo "tag=${image_name}:${{ needs.resolve-source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push API image once
        id: build-image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: src/OpenGameBuilder.Api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Record release identities
        id: identity
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          WEB_SHA256: ${{ needs.package.outputs.web-sha256 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          # Fail closed if the build output is not an actual pullable registry digest.
          docker buildx imagetools inspect "$image_ref" >/dev/null
          printf 'SOURCE_SHA=%s\nAPI_IMAGE=%s\nWEB_SHA256=%s\n' \
            "$SOURCE_SHA" "$image_ref" "$WEB_SHA256" > ./artifacts/release/release-manifest.txt
          echo "api-image=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Check packaged API image locally
        env:
          API_IMAGE: ${{ steps.identity.outputs.api-image }}
        run: |
          set -euo pipefail
          container_id="$(docker run --rm -d --publish 127.0.0.1::8080 "$API_IMAGE")"
          trap 'docker stop "$container_id" >/dev/null' EXIT
          port="$(docker port "$container_id" 8080/tcp | sed -n '1s/.*://p')"
          test -n "$port"
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${port}/api/alive" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id" >&2
          echo 'Packaged API image did not pass its local liveness check.' >&2
          exit 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check production before staging update
        if: ${{ inputs.environment-slug == 'staging' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_SMOKE_TEST_URL is not configured." >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 30 \
            "${PRODUCTION_URL%/}/api/alive" >/dev/null

      - name: Sync deployment files
        env:
          API_IMAGE: ${{ steps.identity.outputs.api-image }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<EOF
            set -euo pipefail
            mkdir -p "${APP_DIR}" "${WEB_DIR}"
            printf '%s\n' "API_IMAGE=${API_IMAGE}" > "${APP_DIR}/.env"
            docker network inspect ogb-edge >/dev/null 2>&1 || {
              echo "Shared edge network is missing; apply the edge configuration first." >&2
              exit 1
            }
          EOF

          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            "artifacts/web-deploy/" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"${WEB_DIR}/"

          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            "${COMPOSE_FILE}" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"${APP_DIR}/compose.yml"

          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            "artifacts/release/release-manifest.txt" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"${APP_DIR}/release-manifest.txt"

      - name: Update application service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<EOF
            set -euo pipefail
            cd "${APP_DIR}"
            docker compose pull
            docker compose up -d

          EOF

  smoke-test:
    name: Smoke test ${{ inputs.environment-slug }}
    needs: deploy
    if: ${{ inputs.smoke-test-url-var != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Curl API liveness endpoint
        env:
          SMOKE_TEST_BASE_URL: ${{ vars[inputs.smoke-test-url-var] }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_TEST_BASE_URL}" ]; then
            echo "Repository variable '${{ inputs.smoke-test-url-var }}' is not set." >&2
            exit 1
          fi
          # Probe the API-backed liveness endpoint (proxied by the edge via /api/*) so the
          # smoke test verifies the API process is actually up, not just the static edge response.
          SMOKE_TEST_URL="${SMOKE_TEST_BASE_URL%/}/api/alive"
          echo "Smoke testing ${SMOKE_TEST_URL}"
          curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 30 --retry-max-time 180 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${SMOKE_TEST_URL}" >/dev/null

      - name: Check production after staging update
        if: ${{ inputs.environment-slug == 'staging' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_SMOKE_TEST_URL is not configured." >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 30 --retry-max-time 180 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${PRODUCTION_URL%/}/api/alive" >/dev/null
