name: _ Deploy

on:
  workflow_call:
    inputs:
      environment-slug:
        description: "Environment slug, e.g. staging or production"
        required: true
        type: string
      git-ref:
        description: "Expected protected-branch commit. Defaults to the calling workflow's commit."
        required: false
        type: string
        default: ""
      source-ref:
        description: "Protected source branch. Defaults to the calling workflow's branch."
        required: false
        type: string
        default: ""
      smoke-test-url-var:
        description: "Name of the repository variable holding the base URL for the browser smoke test."
        required: false
        type: string
        default: ""
      rehearse-rollback:
        description: "After a successful staging browser smoke test, fail the job to exercise recovery."
        required: false
        type: boolean
        default: false

# A selected protected source is executed in jobs launched from the default branch.
# Disable shared Actions cache access so it cannot poison that cache scope.
cache-mode: none

env:
  HUSKY: "0"
  REGISTRY: ghcr.io
  DEPLOY_ROOT: /srv/opengamebuilder
  APP_DIR: /srv/opengamebuilder/${{ inputs.environment-slug }}
  COMPOSE_FILE: ./deploy/${{ inputs.environment-slug }}/compose.yml

jobs:
  resolve-source:
    uses: ./.github/workflows/_resolve-source.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.source-ref || github.ref_name }}
      expected-sha: ${{ inputs.git-ref || github.sha }}

  build-test:
    name: Build and test
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the trusted validation definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate solution
        uses: ./.github/actions/validate
        with:
          checkout-ref: ${{ needs.resolve-source.outputs.protected-revision }}
          working-directory: deployment-source
          artifact-name: ${{ inputs.environment-slug }}-validation
          # The required package job below publishes and verifies the deployable frontend.
          publish-web: "false"

  package:
    name: Package portable web client
    needs:
      - resolve-source
      - build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      web-sha256: ${{ steps.web-identity.outputs.web-sha256 }}
      release-id: ${{ steps.web-identity.outputs.release-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.protected-revision }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false

      - name: Publish web client
        run: |
          dotnet --version
          dotnet publish src/OpenGameBuilder.Web.Client/OpenGameBuilder.Web.Client.csproj \
            --configuration Release -p:RestoreLockedMode=true --output ./artifacts/web

      - name: Locate web publish output
        run: |
          if [ -f ./artifacts/web/wwwroot/index.html ]; then
            echo "WEB_SOURCE=./artifacts/web/wwwroot" >> "$GITHUB_ENV"
          elif [ -f ./artifacts/web/index.html ]; then
            echo "WEB_SOURCE=./artifacts/web" >> "$GITHUB_ENV"
          else
            echo "Could not find published index.html" >&2
            find ./artifacts/web -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Verify portable web configuration
        run: bash scripts/verify-web-publish.sh "$WEB_SOURCE"

      - name: Give browser assets a stable release URL
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.protected-revision }}
        run: |
          set -euo pipefail
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          sed -i "s|<base href=\"/\" />|<base href=\"/releases/${release_id}/\" />|" "$WEB_SOURCE/index.html"
          grep -Fq "<base href=\"/releases/${release_id}/\" />" "$WEB_SOURCE/index.html"
          # Publish generated precompressed index files still contain the old
          # base path; Caddy would serve them in place of the rewritten HTML.
          rm -f "$WEB_SOURCE/index.html.br" "$WEB_SOURCE/index.html.gz" "$WEB_SOURCE/index.html.zst"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Bundle published web files
        run: tar -czf ./artifacts/web-release.tar.gz -C "$WEB_SOURCE" .

      - name: Record web archive checksum
        id: web-identity
        run: |
          set -euo pipefail
          web_sha="$(sha256sum ./artifacts/web-release.tar.gz | cut -d ' ' -f 1)"
          echo "web-sha256=$web_sha" >> "$GITHUB_OUTPUT"
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.environment-slug }}
          path: artifacts/web-release.tar.gz
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy ${{ inputs.environment-slug }}
    needs:
      - resolve-source
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment-slug }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.protected-revision }}
          persist-credentials: false

      - name: Check deployment configuration
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment-slug }}
          EDGE_PROFILE: ${{ vars.EDGE_PROFILE }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          bash scripts/resolve-edge-profile.sh "$DEPLOY_ENVIRONMENT" "$EDGE_PROFILE" >> "$GITHUB_OUTPUT"
          for name in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is unavailable to the deployment job."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo '::error::DEPLOY_HOST is invalid.'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo '::error::DEPLOY_USER is invalid.'; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.environment-slug }}
          path: artifacts/release

      - name: Verify and unpack the packaged frontend
        env:
          WEB_SHA256: ${{ needs.package.outputs.web-sha256 }}
        run: |
          set -euo pipefail
          echo "${WEB_SHA256}  artifacts/release/web-release.tar.gz" | sha256sum --check
          mkdir -p artifacts/web-deploy
          tar -xzf artifacts/release/web-release.tar.gz -C artifacts/web-deploy
          bash scripts/verify-web-publish.sh artifacts/web-deploy

      - name: Resolve image tag
        id: image
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opengamebuilder-api"
          echo "tag=${image_name}:${{ needs.resolve-source.outputs.protected-revision }}" >> "$GITHUB_OUTPUT"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push API image once
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/OpenGameBuilder.Api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Record release identities
        id: identity
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.protected-revision }}
          WEB_SHA256: ${{ needs.package.outputs.web-sha256 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          # Fail closed if the build output is not an actual pullable registry digest.
          docker buildx imagetools inspect "$image_ref" >/dev/null
          printf 'RELEASE_ID=%s\nSOURCE_SHA=%s\nAPI_IMAGE=%s\nWEB_SHA256=%s\n' \
            '${{ needs.package.outputs.release-id }}' "$SOURCE_SHA" "$image_ref" "$WEB_SHA256" > ./artifacts/release/release-manifest.txt
          echo "api-image=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Check packaged API image locally
        env:
          API_IMAGE: ${{ steps.identity.outputs.api-image }}
        run: bash scripts/verify-api-image.sh "$API_IMAGE"

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo '::error::DEPLOY_KNOWN_HOSTS has no key for DEPLOY_HOST.'
            exit 1
          }
          printf 'Host deployment\n  HostName %s\n  User %s\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts

      - name: Verify the host edge profile before transferring a release
        env:
          EDGE_PROFILE: ${{ steps.target.outputs.profile }}
        run: |
          ssh deployment bash -s -- /srv/opengamebuilder/edge "$EDGE_PROFILE" < scripts/verify-edge-profile.sh

      - name: Check colocated production before staging update
        if: ${{ steps.target.outputs.check-production == 'true' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_SMOKE_TEST_URL is not configured." >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 30 \
            "${PRODUCTION_URL%/}/api/alive" >/dev/null

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install browser smoke dependencies
        run: |
          npm ci --prefix tests/deploy-smoke
          cd tests/deploy-smoke
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Transfer candidate release
        env:
          RELEASE_ID: ${{ needs.package.outputs.release-id }}
        run: |
          ssh deployment bash -s -- "$APP_DIR" "$RELEASE_ID" <<'EOF'
            set -euo pipefail
            app_dir="$1"
            release_id="$2"
            mkdir -p "$app_dir/incoming/$release_id"
            docker network inspect ogb-edge >/dev/null 2>&1 || {
              echo "Host edge network is missing; apply this host's edge configuration first." >&2
              exit 1
            }
          EOF
          rsync -az \
            artifacts/release/web-release.tar.gz \
            artifacts/release/release-manifest.txt \
            "${COMPOSE_FILE}" \
            deployment:"${APP_DIR}/incoming/${RELEASE_ID}/"

      - name: Activate candidate release
        id: activate
        env:
          RELEASE_ID: ${{ needs.package.outputs.release-id }}
        run: |
          ssh deployment \
            bash -s -- activate "$APP_DIR" "$RELEASE_ID" < scripts/deploy-app.sh

      - name: Verify edge can read the activated web release
        env:
          RELEASE_ID: ${{ needs.package.outputs.release-id }}
        run: |
          ssh deployment \
            bash -s -- "$APP_DIR" "$RELEASE_ID" <<'EOF'
            set -euo pipefail
            app_dir="$1"
            release_id="$2"
            release_index="$app_dir/web/releases/$release_id/index.html"
            test -f "$release_index"
            edge_index="/srv/opengamebuilder/$(basename "$app_dir")/web/releases/$release_id/index.html"
            docker compose -f /srv/opengamebuilder/edge/compose.yml \
              --project-directory /srv/opengamebuilder/edge \
              exec -T caddy test -f "$edge_index"
            echo "Caddy can read $edge_index"
          EOF

      - name: Check live frontend and API revision
        env:
          SMOKE_TEST_BASE_URL: ${{ vars[inputs.smoke-test-url-var] }}
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.protected-revision }}
          EXPECTED_RELEASE_ID: ${{ needs.package.outputs.release-id }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_TEST_BASE_URL}" ]; then
            echo "Repository variable '${{ inputs.smoke-test-url-var }}' is not set." >&2
            exit 1
          fi
          pwsh -NoProfile -File scripts/check.ps1 browser

      - name: Rehearse staging rollback after a successful browser check
        if: ${{ inputs.environment-slug == 'staging' && inputs.rehearse-rollback }}
        run: |
          echo 'Intentional staging failure: the recovery step must restore the previous release.' >&2
          exit 1

      - name: Check colocated production after staging update
        if: ${{ steps.target.outputs.check-production == 'true' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_SMOKE_TEST_URL is not configured." >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 30 --retry-max-time 180 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${PRODUCTION_URL%/}/api/alive" >/dev/null

      - name: Finalize smoke-tested release
        env:
          RELEASE_ID: ${{ needs.package.outputs.release-id }}
        run: |
          ssh deployment \
            bash -s -- finalize "$APP_DIR" "$RELEASE_ID" < scripts/deploy-app.sh

      - name: Recover the previous release after failure
        if: ${{ failure() && steps.activate.outcome != 'skipped' }}
        env:
          RELEASE_ID: ${{ needs.package.outputs.release-id }}
        run: |
          ssh deployment \
            bash -s -- rollback "$APP_DIR" "$RELEASE_ID" < scripts/deploy-app.sh
