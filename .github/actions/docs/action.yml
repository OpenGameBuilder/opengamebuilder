name: Build documentation
description: Build and validate the rendered documentation site, then retain review evidence.

inputs:
  install-dotnet:
    description: Install the SDK pinned by global.json when the caller has not already done so.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      if: ${{ inputs.install-dotnet == 'true' }}
      env:
        # Keep the pinned SDK isolated from runner-installed workload manifests.
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/ogb-dotnet
      with:
        global-json-file: global.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        package-manager-cache: false

    - name: Build and validate documentation
      shell: pwsh
      run: ./scripts/check-docs.ps1

    - name: Upload rendered documentation and diagnostics
      if: ${{ always() && !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-docs-${{ github.run_attempt }}
        path: |
          artifacts/docs/site/
          artifacts/docs/*.log
        if-no-files-found: warn
        retention-days: 7
