name: Validate solution
description: Shared content, solution, and full validation commands for CI and deployment.

inputs:
  checkout-ref:
    description: Optional immutable protected-source commit to check out after loading this action.
    required: false
    default: ""
  working-directory:
    description: Checked-out solution directory, separate from the trusted action definition.
    required: false
    default: "."
  artifact-name:
    description: Unique name for this job's failure diagnostics.
    required: true
  mode:
    description: Shared check mode (content, quick, or full); deployment keeps full.
    required: false
    default: "full"
  publish-web:
    description: Publish and verify the frontend; disable only when the caller has a separate required packaging job.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Check out the resolved source
      if: ${{ inputs.checkout-ref != '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout-ref }}
        path: ${{ inputs.working-directory }}
        persist-credentials: false

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      if: ${{ inputs.mode != 'content' }}
      env:
        # Runner-installed workload manifests can override the pinned SDK's
        # WebAssembly pack version and invalidate the committed NuGet lock.
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/ogb-dotnet
      with:
        global-json-file: ${{ inputs.working-directory }}/global.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ inputs.mode != 'quick' }}
      with:
        node-version: "22"
        package-manager-cache: false

    - name: Install pinned content tools
      if: ${{ inputs.mode != 'quick' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: ./scripts/install-content-tools.ps1

    - name: Install locked content dependencies
      if: ${{ inputs.mode == 'content' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --ignore-scripts

    - name: Run shared check
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        VALIDATION_MODE: ${{ inputs.mode }}
        PUBLISH_WEB: ${{ inputs.publish-web }}
      run: ./scripts/check.ps1 $env:VALIDATION_MODE -SkipWebPublish:($env:PUBLISH_WEB -eq 'false') -Serial:($env:RUNNER_OS -eq 'Windows')

    - name: Upload validation failure diagnostics
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_attempt }}
        path: ${{ inputs.working-directory }}/artifacts/validation/
        if-no-files-found: warn
        retention-days: 7
