version: 2

updates:
  # NuGet packages, including centrally managed versions in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1
  # .NET SDK version in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7

  # Browser-smoke dependencies, including Playwright and its browser revisions.
  - package-ecosystem: "npm"
    directory: "/tests/deploy-smoke"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1

  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  # Third-party Actions used inside the local composite validation action.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/validate"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:15"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      validation-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  # API Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/src/OpenGameBuilder.Api"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      api-base-images:
        patterns:
          # Dependabot tracks the registry separately from the image name.
          - "dotnet/*"
    # Best effort: registry digest updates without publication dates cannot
    # enforce a cooldown. Review the pinned digest change before merging.
    cooldown:
      default-days: 7

  # Edge infrastructure images, currently Caddy.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/edge"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:15"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      edge-images:
        patterns:
          - "*"
    cooldown:
      default-days: 7
