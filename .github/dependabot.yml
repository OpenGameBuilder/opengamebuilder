version: 2

updates:
  # NuGet packages, including centrally managed versions in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 5
    labels:
      - "needs triage"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 0

  # .NET SDK version in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 2
    labels:
      - "needs triage"
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7

  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 3
    labels:
      - "needs triage"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  # API Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/src/OpenGameBuilder.Api"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 2
    labels:
      - "needs triage"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      api-base-images:
        patterns:
          - "mcr.microsoft.com/dotnet/*"
    cooldown:
      default-days: 7

  # Edge infrastructure images, currently Caddy.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/edge"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:15"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 2
    labels:
      - "needs triage"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      edge-images:
        patterns:
          - "*"
    cooldown:
      default-days: 7
